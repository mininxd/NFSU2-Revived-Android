name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android NFSU2 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Prebuilt Game Native Libraries
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cat prebuilt/lib_arm64.tar.gz.part_* > /tmp/lib_arm64.tar.gz
          tar -xzf /tmp/lib_arm64.tar.gz -C android/app/src/main/jniLibs/arm64-v8a
          rm -f /tmp/lib_arm64.tar.gz
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Build Native Free Roam Companion (libnfsu2_roam.so)
        run: |
          CLANG_BIN=$(find "$ANDROID_HOME/ndk" "$ANDROID_NDK_ROOT" /usr/local/lib/android/sdk/ndk -name "aarch64-linux-android*-clang" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$CLANG_BIN" ]; then
            echo "Searching system for aarch64 clang..."
            CLANG_BIN=$(which aarch64-linux-gnu-gcc || which clang || find / -name "*clang" 2>/dev/null | head -n 1)
          fi
          echo "Using compiler: $CLANG_BIN"
          $CLANG_BIN -std=c11 -O2 -shared -fPIC -ffp-contract=off -fno-strict-aliasing \
            -DROAM_HOST_ANDROID -DROAM_HOST_WIN=1 \
            -Iandroid/app/src/main/cpp/roam \
            android/app/src/main/cpp/roam/roam_core.c \
            android/app/src/main/cpp/roam/roam_game.c \
            android/app/src/main/cpp/roam/roam_android.c \
            -llog -ldl \
            -o android/app/src/main/jniLibs/arm64-v8a/libnfsu2_roam.so
          ls -lh android/app/src/main/jniLibs/arm64-v8a/libnfsu2_roam.so

      - name: Configure Gamefiles Direct Link from Secret (if set)
        env:
          GAMEFILES_URL: ${{ secrets.GAMEFILES_URL || secrets.GAMEFILES_ZIP_URL }}
        if: ${{ env.GAMEFILES_URL != '' }}
        run: |
          echo "Found GAMEFILES_URL secret. Embedding direct link into APK assets..."
          mkdir -p android/app/src/main/assets
          echo "$GAMEFILES_URL" > android/app/src/main/assets/gamefiles_url.txt

      - name: Build NFSU2 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../artifacts/NFSU2.apk
          fi

      - name: Organize APKs
        run: |
          ls -la artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Android-APK
          path: artifacts/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp artifacts/NFSU2.apk artifacts/NFSU2-Revived-${{ github.ref_name }}-arm64.apk
          gh release upload ${{ github.ref_name }} artifacts/NFSU2-Revived-${{ github.ref_name }}-arm64.apk --clobber || \
          gh release create ${{ github.ref_name }} artifacts/NFSU2-Revived-${{ github.ref_name }}-arm64.apk --title "NFSU2 Revived ${{ github.ref_name }}" --generate-notes
