name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android NFSU2 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Prebuilt Game Native Libraries
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cat prebuilt/lib_arm64.tar.gz.part_* > /tmp/lib_arm64.tar.gz
          tar -xzf /tmp/lib_arm64.tar.gz -C android/app/src/main/jniLibs/arm64-v8a
          rm -f /tmp/lib_arm64.tar.gz
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: Build NFSU2 Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../artifacts
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk ../artifacts/NFSU2.apk
          fi

      - name: Organize APKs
        run: |
          ls -la artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NFSU2-Android-APK
          path: artifacts/*.apk
          if-no-files-found: warn
