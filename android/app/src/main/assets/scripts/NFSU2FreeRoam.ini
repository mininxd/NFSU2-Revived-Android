; NFSU2FreeRoam.asi: free-roam multiplayer for Need for Speed Underground 2
; (PC v1.2 North America) with friends on the same network, Windows or Mac.
; Put this file and NFSU2FreeRoam.asi into the game's "scripts" folder (with
; the Ultimate ASI Loader, dinput8.dll, in the game folder).  Messages go to
; scripts\NFSU2FreeRoam.log.

[FreeRoam]
; 1 = on, 0 = the plugin does nothing
Enable = 1

; the name your friends see (printable ASCII, up to 24 characters);
; empty = your game profile's name
Name =

; UDP port, the same on every machine (Mac: roam_port in settings.ini)
Port = 47210

; friends' IP addresses, if they do not show up by themselves (some routers
; and VPNs block the LAN broadcast); one is enough, the others are passed on:
; Peers = 192.168.1.20, 192.168.1.21:47210
Peers =

; 1 = find friends on the LAN by a broadcast every 2 s
Discovery = 1

; only players with the same room name see each other (empty = everybody)
Room =

; your crews, up to 4, joined by commas: players who share one see each other's
; names and map arrows in its colour, everyone else still there
; (Crew = Blue Room, Night Owls; empty = none)
Crew =

; each crew's colour in the order of Crew, 6 hex digits without '#'
; (CrewColours = 3cd2ff, ff4646; empty = cyan, magenta, violet, red)
CrewColours =

; 1 = friends' cars are solid (EXPERIMENTAL: they can shove your car);
; 0 = ghost cars you drive through
Collide = 0

; group size, you included (2..33), and friends' cars shown at once (0..5)
MaxPlayers = 33
MaxCars = 5

; write scripts\NFSU2FreeRoam.log (1) or not (0)
Log = 1
