; Covers also keep coming back: the next one earned is always the one photographed longest ago, so a favorite car can
; be shot again for every cover once it has been through them all in Stage 6.
MagazineEveryWins = 5
DVDEveryWins = 10
MaxWaitingPerCar = 3			; At most this many covers wait for one car at the same time.
Message = 1						; Enable SMS notifications of unlocked Magazine / DVD opportunity
MagazineChallenge = 1			; Enable the race to the photographer events. If disabled, the photoshoot location is shown directly on the map.	
; Pay for a cover photo after the career: CashPerStar times your car's visual rating (stars, at least 1).
; Example: 500 and a 6-star car = $3,000. 0 = the game's own pay ($500 + $100 per star during the career).
CashPerStar = 500	

[Covers.Viewer]
