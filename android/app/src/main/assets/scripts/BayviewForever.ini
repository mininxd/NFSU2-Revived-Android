TestBrowseAll = 0

[HShifter.Log]
; 1 = log every gearbox change and every shift (how long it took, how far the clutch was pressed).
Gearbox = 0
; 1 = log every button, hat and axis change of the controller. Also turns on Gearbox.
Input = 0

[Surround.Test]
; Speaker test (5.1 only). 1 = while driving, the gear picks one speaker and every sound plays from it:
;   1st front left, 2nd center, 3rd front right, 4th rear right, 5th rear left, 6th subwoofer.
; Neutral and reverse play the game's normal mix. 0 = off.
SpeakerTest = 0

[Surround.Log]
; 1 = Log every actively playing sound after each pause/menu change and the sound directions every 20 s
; (to find a stuck sound). 0 = only basic info is logged.
Detailed = 0

[ParticleFix.Log]
; The log gets one line for every frame in a race or free roam that takes longer
; than this many milliseconds (one frame at 60 fps = 16.7 ms).
SpikeMs = 25
; A summary line (average fps, average cost of each particle step) every this many seconds.
SummarySeconds = 10

[ParticleFix.Test]
; 1 = time the particle system (8 redirected CALLs) and write the stutter log. 0 = sprite batch fix only, no log.
TimingHooks = 0
; 1 = clocks on 7 calls in the game's main loop, so slow frames show which part of the frame took the time.
HookMainLoop = 1
; Bisect switches (1 = hook on). Normal play: all 1.
HookRenderFrame = 1
HookUpdate = 1
HookRenderMain = 1
HookRenderView3 = 1
HookOrientedDraw = 1
HookBatchBegin = 1
HookBatchFlush = 1
HookRain = 1
