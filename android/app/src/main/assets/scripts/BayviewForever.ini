; Bayview Forever Settings
; Keep this file in the scripts folder.
; BayviewForever folder contains logs and all additional save data created for Bayview Forever

[Features]
; 0 = off | 1 = on
VirtualGarage = 1				; Enable Virtual Garage, which gives you infinite slots in your career garage in Stage 6 (after beating Caleb).
EndlessCareer = 1				; Enable Endless Career, which adds events in Stage 6 (after beating Caleb).
Covers = 1						; Enable unlocking infinite magazines and DVDs in Stage 6. Older cover photos are kept and can still be viewed (see [Covers.Viewer]).
DragSteering = 1				; Enable real steering and FFB in Drag Races. Disable for vanilla slot car steering.
Wheel = 1						; Enable Wheel and FFB Enhancements and fixes
HShifter = 0					; Enable EA's Cut H-Shifter and Clutch Support
RaceAI = 1					    ; Enable Racer AI fixes. Optionally you can disable Catch-Up, but that is off by default. See below.
Surround = 0					; Enable Surround Sound
ParticleFix = 1					; Enable the particle fix for Windows 10 and 11
UniqueParts = 1					; Enable unlocking unique parts from Stage 6 Outruns
RespawnAtGarage = 0				; Enable respawning at garage when entering free roam from menu
; Respawn at Garage: loading a profile or Quit to Main Menu starts free roam at your garage. Shops and races still put you back where you were.


