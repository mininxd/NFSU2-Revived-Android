; ######################################
; ####      Real Drag Steering      ####
; ######################################

[DragSteering]
NormalSteering = 1				; 1 = drag races use normal steering. 0 = the game's lane-change steering.
ForceFeedback = 1				; 1 = drag races get the same force feedback as other races. 0 = only a centering spring like vanilla.


; ######################################
; ####  Wheel and FFB Enhancements  ####
; ######################################
; Wheels only: this won't impact gamepads and keyboards.
; "% of full force" = share of the strongest force the wheel can make. "% of the game's" = 100 is unchanged.

[Wheel.ForceFeedback]
; Steering force: the push from the front tires (the main road feel). % of the game's (0-300).
; Works like the in-game "Road Feedback" slider (on top of it): it scales the force BEFORE the game caps it at the
; wheel's maximum, so lowering it also brings back detail when the force is clipping (stuck at 100%).
SteeringForce = 65

; Minimum steering force, % of full force (0-50). Lifts small steering forces so a geared wheel doesn't feel
; dead around the center; bigger forces keep their proportions. Makes everything a bit heavier.
; 0 = off (game). 10 suits geared wheels (Logitech G25/G27/G29/G920). Belt or direct-drive wheel: set 0.
MinimumForce = 10

; Center spring: pulls the wheel back to the center, worked out by the wheel itself (smooth, no lag).
; The game has NO center spring while driving. % of full force (0-100), 0 = off (game).
; It grows over the first CenterSpringWidth degrees of wheel turn on each side, then stays at that strength,
; so it firms up the center without making big steering inputs heavy. Try 8-15 with a width of 15-30.
; (The narrowest width possible is limited by DirectInput: the log says the real width it got.)
CenterSpring = 4.5
CenterSpringWidth = 20

; Spring at full steering lock (acts like a soft stop at the end of the steering). % of full force. Game: 100.
FullLockSpring = 56

; Damper: makes the wheel heavy to turn quickly, strongest when standing still, fading out with speed.
; Damper = % of full force at a standstill (game 70.59). DamperFadeSpeed = km/h where it reaches 0
; (game 46.8 km/h). 0 = never fades.
Damper = 0
DamperFadeSpeed = 46.8

; Short knocks (square wave, 0.15 s). % of the game's (0-300).
; CrashJolt = sudden speed loss (hitting walls/cars). BumpJolt = suspension hits (kerbs, landings, bumps).
CrashJolt = 100
BumpJolt = 100

; Road rumble: vibration on rough surfaces, grows with speed. % of the game's (0-300).
RoadRumble = 100

; Slippery surface: Negative damper for drift events that makes the wheel loose and light. % of the game's (0-100).
SlipperySurface = 100

; 1 = all forces stop while the car is in the air (game), 0 = keep them.
PauseInAir = 1

; Spring used when the game's own force feedback option is OFF (and in drag races with DragSteering off).
; % of full force. Game: 70.58.
NoFeedbackSpring = 70.58

; Spring in the menus. % of full force. Game: 70.
MenuSpring = 39

; Soft clipping. The game cuts every steering force above the wheel's maximum flat ("clipped": you lose the detail
; in hard corners). SoftClip gives that much extra room above the maximum (in %) and squeezes it in smoothly: forces
; up to SoftClipKnee (% of full force) stay exactly as they are, stronger ones are compressed so they still change
; instead of sitting flat at 100%. 0 = the game's hard clip. Try SoftClip 50-100 with a knee of 60-80.
SoftClip = 50
SoftClipKnee = 70

[Wheel.Steering]
; The rotation set in the wheel's driver (Logitech Profiler -> Degrees of Rotation). Must match it.
WheelRotation = 450

; How far you turn the wheel (degrees, lock to lock) to reach the game's full steering lock.
; Equal to WheelRotation = the whole wheel. Smaller = full lock earlier; past that the full-lock spring
; pushes back like a soft stop.
SteeringLock = 450

; 1 = read the wheel at full precision (the game cuts it to 255 steps, with a wider dead step in the middle).
; 0 = the game's 255 steps.
FullResolution = 1

; How linear the steering response is. 0 = the game's original curve (half the wheel turn gives only 29% steering,
; very soft around the center), 100 = linear. Not recommended to lower.
Linearity = 100

; Speed-sensitive steering lock. The game allows 45 degrees of front-wheel angle when
; standing, 15 at about 64 km/h and only 7 at high speed, so at speed the whole wheel turn only reaches 7 degrees.
; 100 = game, 0 = 45 degrees at every speed (twitchy at speed). Try 50-80 with a 450-degree wheel.
SpeedSensitivity = 80


; ######################################
; ####  H-Shifter and Analog Clutch ####
; ######################################
; How it works: pick "Manual" transmission in the game's options. BayviewForever turns it into the game's hidden
; "manual with clutch" mode and drives it with an H-shifter and clutch pedal:
;   - Press the clutch (at least ClutchThreshold) while you move the shifter: clean shift.
;   - Shift without the clutch: the gear still goes in, but the engine bogs down and takes a moment to
;     recover. Didn't Dominic tell you not to granny shift?
;   - Lever in no gear = neutral. Shifting into neutral without clutch is fine, no double-clutching here.
;   - The shift paddles/buttons are ignored while the shifter is in use (the shifter decides the gear).
; "Automatic" in the game's options stays automatic.

[HShifter.Gearbox]
ClutchMode = 1				; 1 = manual with clutch (default). 0 = H-shifter without clutch (the game's normal manual gearbox).
; 1 = also in drag races (needs DragSteering on, which keeps the normal driving controls in drags). 0 = drag races
; keep the game's normal manual gearbox.
DragRaces = 1
; 1 = the brake pedal is only a brake and the throttle drives in reverse too (the shifter alone picks R).
; 0 = the game's way: holding the brake at a standstill reverses, and the throttle in R asks for 1st gear.
BrakeOnlyBrakes = 1

[HShifter.Device]
; Part of the name of the controller to read (as shown in Windows' "Game Controllers").
Name = G27

[HShifter.Shifter]
; Button number of each shifter position (1 = first button, as in Windows' "Game Controllers"; 0 = not used).
; The values below are the Logitech G27's.
Reverse = 15
Gear1 = 9
Gear2 = 10
Gear3 = 11
Gear4 = 12
Gear5 = 13
Gear6 = 14

[HShifter.Clutch]
; Axis of the clutch pedal: AUTO (the axis the wheel calls "Clutch"), or X, Y, Z, RX, RY, RZ, SLIDER0, SLIDER1.
; In Logitech's software, "Report Combined Pedals" must be OFF for the clutch to have its own axis.
; (G27: SLIDER1.)
Axis = AUTO
; Pedal values 0..10000 with the pedal up and fully pressed (see [HShifter.Log] Input). G27: up 10000, down 0.
UpValue = 10000
DownValue = 0
; Dead zones in percent of pedal travel: the top part still counts as fully engaged, the bottom part as fully
; pressed. The game only changes gears when the clutch is pressed past about 95%.
TopDeadzone = 5
BottomDeadzone = 10

[HShifter.Shifting]
; How far the clutch pedal must be pressed (percent of its travel) during a shift to count as a clean shift.
ClutchThreshold = 50
; Shifting without the clutch makes the engine bog down: power drops to BogPower percent, stays there for
; BogHold milliseconds, then comes back gradually over BogRecover milliseconds.
; Stronger penalty: lower BogPower, longer BogHold/BogRecover. No penalty: BogPower = 100.
BogPower = 0
BogHold = 400
BogRecover = 1000

; ######################################
; #### AI Fixes and Catchup Toggle  ####
; ######################################

[RaceAI]
; How far (meters) a car must be behind an AI before the AI may move over to block it.
; The game uses 0: an AI can swerve across your nose as soon as its tail is clear of your bumper,
; which is a contributing factor to them crashing into you intentionally.
; A running block also ends when the car behind closes in within this distance.
; 0 = game behavior. Maximum 50.
BlockMinGap = 30

; No blocking at all (by any AI, on anyone) during the first this-many seconds of a race,
; so the pack can sort itself out at the start. 0 = game behavior. Maximum 120.
BlockStartDelay = 20

; Seconds an AI must wait, after it first picks YOU as its block target, before it may block.
; The clock starts when it gets ahead of you (e.g. right after a pass). 0 = game behavior.
BlockDelay = 1.5

; Overtaking YOU: how far (meters) a passing AI's rear bumper must be ahead of your nose before it
; steers back to its racing line. The game moves back as soon as the two cars are level, while they
; still overlap, so it moves over into you (the "PIT on the pass").
; 0 = game behavior. Maximum 10 (the game ends a pass 10 m clear anyway). Only passes on you.
PassClearGap = 5

; 1 = AIs may block you (with the gap and delay above). 0 = AIs never block you (they still block each other).
BlockPlayer = 1

; 1 = no catch-up (rubber band): the AI ignores the game's "Catch Up" setting.
; Career races DO use catch-up (AIs boosted up to 15 %). 0 = game behavior.
; This may make races harder overall, so it is off by default for user friendliness.
DisableCatchUp = 0


; ######################################
; ####  Surround Sound Restoration  ####
; ######################################

[Surround.Audio]
; Speaker layout the game mixes for when Audio Mode is set to Stereo in the game's options.
;   6 = 5.1 surround (front left/right, center, subwoofer, rear left/right)
;   4 = quad (front left/right, rear left/right)
;   2 = the game's normal stereo (surround off)
; Windows' speaker setup should match (Sound settings -> your speakers -> Configure).
; Audio Mode = Mono in the game always stays mono.
Speakers = 6
; 1 = the game's Options menu says "5.1 Surround" or "Quad" instead of "Stereo" while that layout is running
; (if Windows refuses 5.1, it shows what the mod fell back to). 0 = it always says "Stereo".
MenuLabel = 1

[Surround.OwnCar]
; Your car's engine noise. The game measures its direction from the camera to the car's center, which in hood or
; bumper view is right behind you, so it jumps around. With this on, your engine plays from the front speakers
; instead. 1 = on, 0 = the game's direction.
OwnEnginePlacement = 1
; Share of your engine sound from the front speakers, in percent (0 to 100); the rest comes from the rears.
; 100 = all front, 0 = all rear.
EngineFront = 75
; How much of the engine's front part comes from the center speaker, in percent; the rest is shared equally by front
; left and front right. 33 = all three equal, 100 = center only, 0 = front left/right only.
EngineCenter = 50
; Volume of your own engine, in percent of the game's (0 to 200). Lower it if the engine drowns out other cars,
; traffic, and the echo off walls. (Only with OwnEnginePlacement = 1.)
EngineVolume = 80
; 1 = your car's other sounds (turbo, ...) get the same front/rear blend as the engine in hood and bumper view (the
; game puts them at the car's center, right behind you). 0 = only the engine. (Only with OwnEnginePlacement = 1.)
AllOwnSounds = 1

[Surround.Sounds]
; Who doesn't love turbo noises?
; Volume of your turbo's blow-off (the "pssh" when you lift off the throttle), in percent of the game's (0 to 400).
; 100 = the game's. The game never plays any sound louder than its full volume, so very high values stop adding.
; Works in stereo too: enable Surround and set Speakers = 2 (engine placement and the speaker balance only work with 4 or 6 speakers).
BlowOffVolume = 150
; Volume of your turbo's spool (the whistle while boost builds), in percent of the game's (0 to 400). Same limit.
SpoolVolume = 150

[Surround.Balance]
; Volume of each speaker, in percent (0 to 200), for every sound in the game. 100 = unchanged.
; Use these if one side or the rears sound too loud (e.g. FrontRight = 90 if the mix leans right).
; Only in 5.1 (Speakers = 6).
FrontLeft = 100
Center = 100
FrontRight = 100
RearLeft = 100
RearRight = 100
Subwoofer = 150
; The game sends nothing to the subwoofer channel (only a few special sounds). This sends a share of every sound to
; it too, in percent (0 to 100). 0 = the game's mix. If your receiver already redirects the bass of small speakers
; to the subwoofer, leave this at 0.
SubwooferSend = 0

; ######################################
; ####        Particle Fix          ####
; ######################################
; Limit your frame rate to 60fps or lower using your GPU Control Panel or ThirteenAG's Widescreen Fix.
; Also, lower your road reflections down one notch from the highest setting.

[ParticleFix.Fix]
; 1 = particle sprite batches are appended to the game's particle vertex buffer and it is only cleared when
; full. The game clears it for every batch, which can stall the graphics driver when lots of particles are on
; screen. 0 = the game's original behavior.
BatchAppend = 1


