plugins { id 'com.android.application' }
android {
    namespace 'io.mininxd.nfsu2'
    compileSdk 35
    defaultConfig {
        applicationId 'io.mininxd.nfsu2'
        minSdk 29
        targetSdk 35
        versionCode 37
        versionName '0.14.22'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'nfsu2release'
            keyAlias 'nfsu2'
            keyPassword 'nfsu2release'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    // adrenotools opens its namespace hook libraries by path from nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
}
