plugins { id 'com.android.application' }
android {
    namespace 'io.mininxd.nfsu2'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'io.mininxd.nfsu2'
        minSdk 29
        targetSdk 35
        versionCode 25
        versionName '0.14.10'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'nfsu2release'
            keyAlias 'nfsu2'
            keyPassword 'nfsu2release'
        }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    // adrenotools opens its namespace hook libraries by path from nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
}
